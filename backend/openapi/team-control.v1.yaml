openapi: 3.1.0
info:
  title: GoClaw Team Control API
  version: 1.0.0
  description: Authenticated workspace projection and Delivery Kernel contract.
servers:
  - url: /control-plane
paths:
  /v1/workspaces/{workspace}:
    get:
      operationId: getWorkspace
      parameters:
        - $ref: '#/components/parameters/Workspace'
      responses:
        '200':
          description: Trusted workspace projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
        default:
          $ref: '#/components/responses/Problem'
  /v1/workspaces/{workspace}/members:
    get:
      operationId: listMembers
      parameters:
        - $ref: '#/components/parameters/Workspace'
      responses:
        '200':
          description: Trusted active human members and control-plane agents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembersResponse'
        default:
          $ref: '#/components/responses/Problem'
  /v1/workspaces/{workspace}/projects/{project}/projection:
    get:
      operationId: getProjectProjection
      parameters:
        - $ref: '#/components/parameters/Workspace'
        - $ref: '#/components/parameters/Project'
      responses:
        '200':
          description: Replay-verified project state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectProjection'
        default:
          $ref: '#/components/responses/Problem'
  /v1/workspaces/{workspace}/projects/{project}/events:
    get:
      operationId: streamProjectEvents
      parameters:
        - $ref: '#/components/parameters/Workspace'
        - $ref: '#/components/parameters/Project'
        - name: after
          in: query
          schema:
            type: integer
            minimum: 0
        - name: Last-Event-ID
          in: header
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Project-scoped SSE. Each session event uses its sequence as the event id.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
  /v1/workspaces/{workspace}/projects/{project}/commands:
    post:
      operationId: executeProjectCommand
      parameters:
        - $ref: '#/components/parameters/Workspace'
        - $ref: '#/components/parameters/Project'
        - name: X-CSRF-Token
          in: header
          description: Required for cookie-authenticated mutations.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
      responses:
        '201':
          description: Idempotent append result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppendResult'
        default:
          $ref: '#/components/responses/Problem'
components:
  parameters:
    Workspace:
      name: workspace
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    Project:
      name: project
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
  responses:
    Problem:
      description: Stable RFC 7807-style failure. Status may be 400, 403, 404, 409, 422, 500, or 503.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Identifier:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
    WorkspaceResponse:
      type: object
      required: [schema_version, workspace]
      properties:
        schema_version: { const: 1 }
        workspace:
          $ref: '#/components/schemas/Workspace'
    Workspace:
      type: object
      required: [id, name, state, version, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        name: { type: string }
        state: { enum: [active, archived] }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MembersResponse:
      type: object
      required: [schema_version, members]
      properties:
        schema_version: { const: 1 }
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'
    Member:
      type: object
      required: [workspace_id, id, kind, role, state, version, created_at, updated_at]
      properties:
        workspace_id: { $ref: '#/components/schemas/Identifier' }
        id: { $ref: '#/components/schemas/Identifier' }
        kind: { enum: [human, agent] }
        role: { enum: [owner, admin, member, reviewer, viewer] }
        state: { enum: [active, removed] }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProjectProjection:
      type: object
      required: [schema_version, workspace_id, project_id, head, head_hash, nodes, edges, evidence, checks, acceptances]
      properties:
        schema_version: { const: 1 }
        workspace_id: { $ref: '#/components/schemas/Identifier' }
        project_id: { $ref: '#/components/schemas/Identifier' }
        head: { type: integer, minimum: 0 }
        head_hash: { type: string }
        nodes: { type: object, additionalProperties: { $ref: '#/components/schemas/WorkNode' } }
        edges: { type: object, additionalProperties: { $ref: '#/components/schemas/WorkEdge' } }
        evidence: { type: object, additionalProperties: { $ref: '#/components/schemas/EvidenceRef' } }
        checks: { type: object, additionalProperties: { type: array, items: { $ref: '#/components/schemas/CheckResult' } } }
        acceptances: { type: object, additionalProperties: { $ref: '#/components/schemas/Acceptance' } }
    WorkNode:
      type: object
      additionalProperties: false
      required: [id, kind, revision, state, creator_id, assignee_ids, executor_ids]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        kind: { type: string, minLength: 1 }
        revision: { type: integer, minimum: 1 }
        state: { type: string, minLength: 1 }
        creator_id: { $ref: '#/components/schemas/Identifier' }
        assignee_ids: { type: array, items: { $ref: '#/components/schemas/Identifier' } }
        executor_ids: { type: array, items: { $ref: '#/components/schemas/Identifier' } }
        data: {}
    WorkEdge:
      type: object
      additionalProperties: false
      required: [id, from, to, kind]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        from: { $ref: '#/components/schemas/Identifier' }
        to: { $ref: '#/components/schemas/Identifier' }
        kind: { enum: [depends_on, blocks, trace] }
    EvidenceRef:
      type: object
      additionalProperties: false
      required: [id, subject_id, kind, uri, sha256, size, media_type, produced_by, sanitized, captured_at]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        subject_id: { $ref: '#/components/schemas/Identifier' }
        kind: { type: string, minLength: 1 }
        uri: { type: string, pattern: '^artifact://[A-Za-z0-9][A-Za-z0-9._-]{0,63}/[0-9a-fA-F-]{36}$' }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        size: { type: integer, minimum: 0 }
        media_type: { type: string, minLength: 1 }
        produced_by: { $ref: '#/components/schemas/Identifier' }
        run_id: { $ref: '#/components/schemas/Identifier' }
        sanitized: { const: true }
        captured_at: { type: string, format: date-time }
    CheckResult:
      type: object
      additionalProperties: false
      required: [id, policy_id, subject_id, revision, outcome, evidence_ids, checker_id, deterministic, recorded_at]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        policy_id: { $ref: '#/components/schemas/Identifier' }
        subject_id: { $ref: '#/components/schemas/Identifier' }
        revision: { type: integer, minimum: 1 }
        outcome: { enum: [passed, failed] }
        evidence_ids: { type: array, items: { $ref: '#/components/schemas/Identifier' } }
        checker_id: { $ref: '#/components/schemas/Identifier' }
        deterministic: { type: boolean }
        recorded_at: { type: string, format: date-time }
    Acceptance:
      type: object
      additionalProperties: false
      required: [subject_id, revision, acceptor_id, policy_ids, accepted_at]
      properties:
        subject_id: { $ref: '#/components/schemas/Identifier' }
        revision: { type: integer, minimum: 1 }
        acceptor_id: { $ref: '#/components/schemas/Identifier' }
        policy_ids: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
        accepted_at: { type: string, format: date-time }
    CommandRequest:
      unevaluatedProperties: false
      oneOf:
        - $ref: '#/components/schemas/RequirementStartCommand'
        - $ref: '#/components/schemas/RequirementIntentCommand'
        - $ref: '#/components/schemas/RequirementSolutionCommand'
        - $ref: '#/components/schemas/RequirementFreezeCommand'
        - $ref: '#/components/schemas/RequirementChangeCommand'
        - $ref: '#/components/schemas/RequirementTaskCommand'
        - $ref: '#/components/schemas/DefectCreateCommand'
        - $ref: '#/components/schemas/RiskCreateCommand'
        - $ref: '#/components/schemas/QualityCloseCommand'
        - $ref: '#/components/schemas/FindingCreateCommand'
        - $ref: '#/components/schemas/FindingResolveCommand'
        - $ref: '#/components/schemas/KnowledgeCreateCommand'
        - $ref: '#/components/schemas/KnowledgePublishCommand'
        - $ref: '#/components/schemas/KnowledgeInvalidateCommand'
        - $ref: '#/components/schemas/RunQueueCommand'
        - $ref: '#/components/schemas/RunClaimCommand'
        - $ref: '#/components/schemas/RunHeartbeatCommand'
        - $ref: '#/components/schemas/RunCompleteCommand'
        - $ref: '#/components/schemas/RunCancelCommand'
        - $ref: '#/components/schemas/RunRetryCommand'
        - $ref: '#/components/schemas/EvidenceAttachCommand'
        - $ref: '#/components/schemas/CheckRecordCommand'
        - $ref: '#/components/schemas/DoneAcceptCommand'
      discriminator:
        propertyName: type
    CommandBase:
      type: object
      required: [command_id, expected_head]
      properties:
        command_id: { $ref: '#/components/schemas/Identifier' }
        expected_head: { type: integer, minimum: 0 }
    IDTextPayload:
      type: object
      additionalProperties: false
      required: [id, text]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        text: { type: string, minLength: 1 }
    DonePayload:
      type: object
      additionalProperties: false
      required: [subject_id, revision]
      properties:
        subject_id: { $ref: '#/components/schemas/Identifier' }
        revision: { type: integer, minimum: 1 }
        policies: { type: array, items: { type: string, minLength: 1 }, uniqueItems: true }
    IDOnlyPayload:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
    RequirementTaskPayload:
      type: object
      additionalProperties: false
      required: [requirement_id, task_id, assignee_id, edge_command_id]
      properties:
        requirement_id: { $ref: '#/components/schemas/Identifier' }
        task_id: { $ref: '#/components/schemas/Identifier' }
        assignee_id: { $ref: '#/components/schemas/Identifier' }
        edge_command_id: { $ref: '#/components/schemas/Identifier' }
    DefectCreatePayload:
      type: object
      additionalProperties: false
      required: [id, data]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        data:
          type: object
          additionalProperties: false
          required: [summary, severity, reproduction]
          properties:
            summary: { type: string, minLength: 1 }
            severity: { enum: [critical, high, medium, low] }
            reproduction: { type: string, minLength: 1 }
    RiskCreatePayload:
      type: object
      additionalProperties: false
      required: [id, data]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        data:
          type: object
          additionalProperties: false
          required: [summary, probability, impact, response_plan, review_due_at]
          properties:
            summary: { type: string, minLength: 1 }
            probability: { type: integer, minimum: 1, maximum: 5 }
            impact: { type: integer, minimum: 1, maximum: 5 }
            response_plan: { type: string, minLength: 1 }
            review_due_at: { type: string, format: date-time }
    FindingCreatePayload:
      type: object
      additionalProperties: false
      required: [id, data]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        data:
          type: object
          additionalProperties: false
          required: [rule_id, summary, model_finding]
          properties:
            rule_id: { $ref: '#/components/schemas/Identifier' }
            summary: { type: string, minLength: 1 }
            model_finding: { type: boolean }
    KnowledgeCreatePayload:
      type: object
      additionalProperties: false
      required: [id, data]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        data:
          type: object
          additionalProperties: false
          required: [title, source_ids, evidence_ids, dedup_key]
          properties:
            title: { type: string, minLength: 1 }
            source_ids: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Identifier' } }
            evidence_ids: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Identifier' } }
            dedup_key: { type: string, minLength: 1 }
    RunQueuePayload:
      type: object
      additionalProperties: false
      required: [id, workspace_ref, secret_refs, max_attempts]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        workspace_ref: { type: string, pattern: '^worktree://[A-Za-z0-9][A-Za-z0-9._-]{0,63}(/[A-Za-z0-9][A-Za-z0-9._-]{0,63})*$' }
        secret_refs:
          type: array
          items: { type: string, pattern: '^secret://[A-Za-z0-9][A-Za-z0-9._-]{0,63}/[0-9a-fA-F-]{36}$' }
        max_attempts: { type: integer, minimum: 1 }
    LeasePayload:
      type: object
      additionalProperties: false
      required: [id, lease_seconds]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        lease_seconds: { type: integer, minimum: 1 }
    CommandVariant:
      type: object
      required: [type, payload]
    RequirementStartCommand: { $ref: '#/components/schemas/RequirementTextCommand' }
    RequirementIntentCommand:
      allOf: [{ $ref: '#/components/schemas/CommandBase' }, { type: object, required: [type, payload], properties: { type: { const: requirement.intent }, payload: { $ref: '#/components/schemas/IDTextPayload' } } }]
    RequirementSolutionCommand:
      allOf: [{ $ref: '#/components/schemas/CommandBase' }, { type: object, required: [type, payload], properties: { type: { const: requirement.solution }, payload: { $ref: '#/components/schemas/IDTextPayload' } } }]
    RequirementChangeCommand:
      allOf: [{ $ref: '#/components/schemas/CommandBase' }, { type: object, required: [type, payload], properties: { type: { const: requirement.change }, payload: { $ref: '#/components/schemas/IDTextPayload' } } }]
    RequirementTextCommand:
      allOf: [{ $ref: '#/components/schemas/CommandBase' }, { type: object, required: [type, payload], properties: { type: { const: requirement.start }, payload: { $ref: '#/components/schemas/IDTextPayload' } } }]
    RequirementFreezeCommand: { $ref: '#/components/schemas/RequirementDoneCommand' }
    RequirementDoneCommand:
      allOf: [{ $ref: '#/components/schemas/CommandBase' }, { type: object, required: [type, payload], properties: { type: { const: requirement.freeze }, payload: { $ref: '#/components/schemas/DonePayload' } } }]
    RequirementTaskCommand:
      allOf: [{ $ref: '#/components/schemas/CommandBase' }, { type: object, required: [type, payload], properties: { type: { const: requirement.task }, payload: { $ref: '#/components/schemas/RequirementTaskPayload' } } }]
    DefectCreateCommand:
      allOf: [{ $ref: '#/components/schemas/CommandBase' }, { type: object, required: [type, payload], properties: { type: { const: defect.create }, payload: { $ref: '#/components/schemas/DefectCreatePayload' } } }]
    RiskCreateCommand:
      allOf: [{ $ref: '#/components/schemas/CommandBase' }, { type: object, required: [type, payload], properties: { type: { const: risk.create }, payload: { $ref: '#/components/schemas/RiskCreatePayload' } } }]
    QualityCloseCommand:
      allOf: [{ $ref: '#/components/schemas/CommandBase' }, { type: object, required: [type, payload], properties: { type: { const: quality.close }, payload: { $ref: '#/components/schemas/DonePayload' } } }]
    FindingCreateCommand:
      allOf: [{ $ref: '#/components/schemas/CommandBase' }, { type: object, required: [type, payload], properties: { type: { const: finding.create }, payload: { $ref: '#/components/schemas/FindingCreatePayload' } } }]
    FindingResolveCommand:
      allOf: [{ $ref: '#/components/schemas/CommandBase' }, { type: object, required: [type, payload], properties: { type: { const: finding.resolve }, payload: { $ref: '#/components/schemas/DonePayload' } } }]
    KnowledgeCreateCommand:
      allOf: [{ $ref: '#/components/schemas/CommandBase' }, { type: object, required: [type, payload], properties: { type: { const: knowledge.create }, payload: { $ref: '#/components/schemas/KnowledgeCreatePayload' } } }]
    KnowledgePublishCommand:
      allOf: [{ $ref: '#/components/schemas/CommandBase' }, { type: object, required: [type, payload], properties: { type: { const: knowledge.publish }, payload: { $ref: '#/components/schemas/DonePayload' } } }]
    KnowledgeInvalidateCommand: { $ref: '#/components/schemas/KnowledgeIDCommand' }
    KnowledgeIDCommand:
      allOf: [{ $ref: '#/components/schemas/CommandBase' }, { type: object, required: [type, payload], properties: { type: { const: knowledge.invalidate }, payload: { $ref: '#/components/schemas/IDOnlyPayload' } } }]
    RunQueueCommand:
      allOf: [{ $ref: '#/components/schemas/CommandBase' }, { type: object, required: [type, payload], properties: { type: { const: run.queue }, payload: { $ref: '#/components/schemas/RunQueuePayload' } } }]
    RunClaimCommand:
      allOf: [{ $ref: '#/components/schemas/CommandBase' }, { type: object, required: [type, payload], properties: { type: { const: run.claim }, payload: { $ref: '#/components/schemas/LeasePayload' } } }]
    RunHeartbeatCommand:
      allOf: [{ $ref: '#/components/schemas/CommandBase' }, { type: object, required: [type, payload], properties: { type: { const: run.heartbeat }, payload: { $ref: '#/components/schemas/LeasePayload' } } }]
    RunCompleteCommand:
      allOf: [{ $ref: '#/components/schemas/CommandBase' }, { type: object, required: [type, payload], properties: { type: { const: run.complete }, payload: { $ref: '#/components/schemas/IDOnlyPayload' } } }]
    RunCancelCommand:
      allOf: [{ $ref: '#/components/schemas/CommandBase' }, { type: object, required: [type, payload], properties: { type: { const: run.cancel }, payload: { $ref: '#/components/schemas/IDOnlyPayload' } } }]
    RunRetryCommand:
      allOf: [{ $ref: '#/components/schemas/CommandBase' }, { type: object, required: [type, payload], properties: { type: { const: run.retry }, payload: { $ref: '#/components/schemas/IDOnlyPayload' } } }]
    EvidenceAttachCommand:
      allOf: [{ $ref: '#/components/schemas/CommandBase' }, { type: object, required: [type, payload], properties: { type: { const: evidence.attach }, payload: { $ref: '#/components/schemas/EvidenceRef' } } }]
    CheckRecordCommand:
      allOf: [{ $ref: '#/components/schemas/CommandBase' }, { type: object, required: [type, payload], properties: { type: { const: check.record }, payload: { $ref: '#/components/schemas/CheckResult' } } }]
    DoneAcceptCommand:
      allOf: [{ $ref: '#/components/schemas/CommandBase' }, { type: object, required: [type, payload], properties: { type: { const: done.accept }, payload: { allOf: [{ $ref: '#/components/schemas/DonePayload' }], required: [policies] } } }]
    AppendResult:
      type: object
      required: [events, head, head_hash, replayed]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/SessionEvent'
        head: { type: integer, minimum: 1 }
        head_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        replayed: { type: boolean }
    SessionEvent:
      type: object
      required: [schema_version, workspace_id, project_id, sequence, event_id, command_id, type, actor_id, actor_kind, payload, previous_hash, hash, occurred_at]
      properties:
        schema_version: { const: 1 }
        workspace_id: { $ref: '#/components/schemas/Identifier' }
        project_id: { $ref: '#/components/schemas/Identifier' }
        sequence: { type: integer, minimum: 1 }
        event_id: { type: string, format: uuid }
        command_id: { $ref: '#/components/schemas/Identifier' }
        type: { type: string }
        actor_id: { $ref: '#/components/schemas/Identifier' }
        actor_kind: { enum: [human, agent] }
        payload: {}
        previous_hash: { type: string }
        hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        occurred_at: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status, code, detail]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        field: { type: string }
        detail: { type: string }
