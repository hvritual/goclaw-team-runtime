name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod

      - name: Verify Go formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Verify task traceability
        if: github.event_name == 'pull_request'
        run: ./scripts/check-task-trailers.sh "${{ github.event.pull_request.base.sha }}"

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version-file: go.mod

    - name: Build
      run: go build -v ./...

  test:
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        # Some upstream channel integration tests open live vendor WebSockets.
        # Keep CI hermetic; those adapters require a separate credentialed
        # staging workflow rather than untrusted PR execution.
        run: >-
          go test -race -count=1
          -coverprofile=coverage.out -covermode=atomic
          ./memory ./memory/catalog ./governance ./ouroboros
          ./orchestratorlite ./harness ./teamcontrol ./workstation
          ./providers ./gateway ./agent ./agent/tools ./config ./cli

      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.out

  web-console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci --registry=https://registry.npmjs.org --replace-registry-host=always
      - run: npm run build

  optional-obsidian-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/obsidian-goclaw
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/obsidian-goclaw/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
