name: P2-S08 Docs Probe

on:
  push:
    branches:
      - agent/iot-edt-p2-s08-docs-probe

permissions:
  contents: write

jobs:
  append-journal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Append P2-S08 acceptance evidence
        shell: bash
        run: |
          set -euo pipefail
          cat >> backend/docs/plans/iot-engineering-digital-thread/journal.md <<'EOF'

## 2026-09-01 — P2-S08 Engineering MCP validation acceptance

- P2-S08 was implemented on isolated branch `agent/iot-edt-p2-s08-mcp`, forked from PR #13's latest P2-S07 integration head so Engineering MCP development never pushed to or invalidated PR #13's independent-review gate.
- Added a stdio-only `backend/cmd/engineering-mcp` sidecar using the official Tier-1 Go MCP SDK `github.com/modelcontextprotocol/go-sdk` v1.7.0. V1 fixes Auth `user_id` at process start; MCP tool arguments cannot supply or override caller identity.
- Added the planned eight capabilities: `engineering_entity_get/list/search`, `engineering_thread_traverse`, `engineering_change_get/list`, `context_pack_get`, and `context_pack_compile`.
- Entity/graph/Change/ContextPack reads reuse the existing Engineering application `contract.Service` and its workspace membership authorization. MCP does not read Auth tables directly.
- `context_pack_compile` uses the new Engineering application `AuthorizedContextCompiler`; owner/admin may compile and freeze an immutable ContextPack, while member/non-member access is denied. MCP cannot accept a Change, publish governed Knowledge, mutate RBAC, mutate Runtime lifecycle, or satisfy Todo/human DoneGate.
- Entity list/search and graph traversal are deterministic and bounded. Traversal defaults to depth 2 / 64 nodes and hard-limits depth to 4 / nodes to 256; truncation is explicit rather than silently expanding the graph.
- MCP error mapping exposes stable semantic categories and suppresses wrapped dependency/storage detail so credentials, SQLite details, and internal errors are not leaked to clients.
- Dependency tidy was generated by GitHub-hosted Go 1.26.1, not reconstructed by hand. Probe run `33482625215` printed the exact `go mod tidy` diff. Probe run `33482732419` persisted the machine-generated module files as bot commit `594c1348fccaa3dd894845c0b191c278d249c2f7`.
- Product tidy commit `896d19947f8dd8522491a238406f132a95c1a2a4` reuses only the machine-generated `backend/go.mod` blob `1852e8025e797c7f2223e97d06a8af27d2f3fe5f` and `backend/go.sum` blob `48de703a02f2bb17f7e65825304603066229cfff`. Compare from the restored pre-tidy head shows only those two files; `go.sum` is additions-only (`+16/-0`) and no pre-existing checksum is modified or removed.
- Final P2-S08 product validation head is `896d19947f8dd8522491a238406f132a95c1a2a4`.
- Validation-only draft PR #14 canonical workflow run `33482861699` is fully green: `governance-policy`, repository-declared Go 1.26.1 deterministic `make check`, canonical `make test-race`, frontend validation, and final `CI / required` all succeeded.
- The green `make check` proves the official MCP SDK v1.7.0 module graph and typed tool APIs compile under Go 1.26.1 and that MCP/authorization tests, vet, policy, generated-code checks, and all pre-existing backend tests pass. The race suite also passed against the identical product head.
- `server/**` remains unchanged. P2-S08 validation is **accepted on the stacked P2 branch**.
- Canonical integration is intentionally still pending: protected PR #13 (`P1-EXIT + P2-S01..S07`) remains ahead in the integration order and requires an independent GitHub approval from someone other than the last pusher. PR #14 is validation-only and must not be merged directly. After #13 lands, P2-S08 must be rebased/integrated through the same protected rules.

