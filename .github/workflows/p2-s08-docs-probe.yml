name: P2-S08 Docs Probe

on:
  push:
    branches:
      - agent/iot-edt-p2-s08-docs-probe

permissions:
  contents: write

jobs:
  append-journal:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Append P2-S08 acceptance evidence
        shell: bash
        env:
          JOURNAL_APPEND_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$JOURNAL_APPEND_B64" | base64 --decode >> backend/docs/plans/iot-engineering-digital-thread/journal.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/docs/plans/iot-engineering-digital-thread/journal.md
          git commit -m 'docs(engineering): machine-append P2-S08 acceptance journal [skip ci]'
          git push origin HEAD:agent/iot-edt-p2-s08-docs-probe
