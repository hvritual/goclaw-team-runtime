name: P2-S08 Tidy Probe

on:
  push:
    branches:
      - agent/iot-edt-p2-s08-tidy-probe

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Generate and persist exact module tidy result
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          go mod tidy
          echo '=== P2-S08 GO MOD TIDY DIFF BEGIN ==='
          git diff -- go.mod go.sum
          echo '=== P2-S08 GO MOD TIDY DIFF END ==='
          if git diff --quiet -- go.mod go.sum; then
            echo 'module files already tidy'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add go.mod go.sum
          git commit -m 'chore(engineering): machine-generate P2-S08 module tidy [skip ci]'
          git push origin HEAD:agent/iot-edt-p2-s08-tidy-probe
