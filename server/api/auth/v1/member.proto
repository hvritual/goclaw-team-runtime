syntax = "proto3";

package auth.v1;

import "annotations/v1/access.proto";
import "google/api/annotations.proto";

option go_package = "github.com/multica-ai/multica/server/gen/go/auth/v1;authv1";

// MemberService owns Workspace Membership, invitations, Workspace Roles, and
// the invariant that every Workspace retains at least one Owner.
service MemberService {
  option (annotations.v1.module) = {code: "auth" name: "Auth" version: "v1"};

  // ListMembers returns the human memberships visible inside one workspace.
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {
    option (google.api.http) = {
      get: "/api/workspaces/{workspace_id}/members"
      response_body: "members"
    };
    option (annotations.v1.access) = {
      permission_code: "auth.member.list"
      permission_name: "List members"
      resource: "auth.member"
      action: "list"
    };
  }

  // UpdateMemberRole changes one workspace membership role while preserving
  // the invariant that every workspace has at least one Owner.
  rpc UpdateMemberRole(UpdateMemberRoleRequest) returns (Member) {
    option (google.api.http) = {
      patch: "/api/workspaces/{workspace_id}/members/{member_id}"
      body: "*"
    };
    option (annotations.v1.access) = {
      permission_code: "auth.member.change_role"
      permission_name: "Change member role"
      resource: "auth.member"
      action: "change_role"
      audit: true
    };
  }

  // DeleteMember removes one membership while preserving authorization and
  // the invariant that every workspace retains at least one Owner.
  rpc DeleteMember(DeleteMemberRequest) returns (DeleteMemberResponse) {
    option (google.api.http) = {delete: "/api/workspaces/{workspace_id}/members/{member_id}"};
    option (annotations.v1.http_success_status) = 204;
    option (annotations.v1.access) = {
      permission_code: "auth.member.remove"
      permission_name: "Remove member"
      resource: "auth.member"
      action: "remove"
      audit: true
    };
  }

  // LeaveWorkspace removes the authenticated participant's own membership.
  rpc LeaveWorkspace(LeaveWorkspaceRequest) returns (LeaveWorkspaceResponse) {
    option (google.api.http) = {post: "/api/workspaces/{workspace_id}/leave"};
    option (annotations.v1.http_success_status) = 204;
    option (annotations.v1.access) = {
      permission_code: "auth.member.leave"
      permission_name: "Leave workspace"
      resource: "auth.member"
      action: "leave"
      audit: true
    };
  }
}

enum WorkspaceRole {
  WORKSPACE_ROLE_UNSPECIFIED = 0;
  WORKSPACE_ROLE_OWNER = 1;
  WORKSPACE_ROLE_ADMIN = 2;
  WORKSPACE_ROLE_MEMBER = 3;
}

// Member identifies a human participant inside one Workspace.
message Member {
  string id = 1;
  string workspace_id = 2;
  string user_id = 3;
  // String preserves the existing owner/admin/member JSON contract while the
  // application maps it to the WorkspaceRole domain vocabulary.
  string role = 4;
  string created_at = 5;
  string name = 6;
  string email = 7;
  // Presence preserves the existing JSON null|string contract. The generated
  // response_body path uses standard JSON for the top-level member array.
  optional string avatar_url = 8;
}

message ListMembersRequest {
  string workspace_id = 1;
}

message ListMembersResponse {
  repeated Member members = 1;
}

message UpdateMemberRoleRequest {
  string workspace_id = 1;
  string member_id = 2;
  string role = 3;
}

message DeleteMemberRequest {
  string workspace_id = 1;
  string member_id = 2;
}

message DeleteMemberResponse {}

message LeaveWorkspaceRequest {
  string workspace_id = 1;
}

message LeaveWorkspaceResponse {}
