syntax = "proto3";

package system.v1;

import "annotations/v1/access.proto";
import "google/api/annotations.proto";

option go_package = "github.com/multica-ai/multica/server/gen/go/system/v1;systemv1";

service SystemService {
  option (annotations.v1.module) = {code: "system" name: "System" version: "v1"};

  rpc Ping(PingRequest) returns (PingResponse) {
    option (google.api.http) = {get: "/v1/system/ping"};
    option (annotations.v1.access) = {public: true};
  }
}

message PingRequest {}
message PingResponse { string message = 1; }
