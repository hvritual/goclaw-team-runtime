version: v2

modules:
  - path: api

deps:
  - buf.build/googleapis/googleapis

lint:
  use:
    - STANDARD
  except:
    # Preserves the accepted Issue update contract, which returns the Issue
    # resource directly instead of wrapping it in a method-specific response.
    - RPC_RESPONSE_STANDARD_NAME

breaking:
  use:
    - FILE
